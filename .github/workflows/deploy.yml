name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        # The base-href is critical for GitHub Pages. 
        # By default, we assume this is a Project Page (e.g. username.github.io/repo-name/).
        # If this is your User Page (e.g. username.github.io), remove the --base-href flag or set it to "/".
        # This script dynamically sets the base-href to /repo_name/
        run: |
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          flutter build web --release --base-href "/$REPO_NAME/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
